</style></head><body>
<div id="login" hidden><div class="lc"><div class="logo" id="lg"></div><h1>Panou Facțiuni</h1><p>Autentifică-te cu Discord pentru a continua. Accesul este permis doar membrilor cu rolul potrivit.</p><a href="/auth/login"><button class="btn p">Continuă cu Discord</button></a></div></div>
<div id="pick" hidden><div class="pk"><h1>Alege facțiunea</h1><p>Selectează panoul în care vrei să lucrezi.</p><div class="pkg" id="pkg"></div><p style="margin-top:22px"><button class="btn" onclick="out()">Deconectare</button></p></div></div>

</aside>
<main><div id="content"></div></main></div>
<dialog id="dlg"><div class="dh"><div class="mi" id="cI"></div><div><h3 id="cT"></h3><p id="cM"></p></div></div><form method="dialog"><button class="btn" value="cancel">Anulează</button><button class="btn p" id="cOk" value="ok">Confirmă</button></form></dialog>

<script>
const P={shield:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z",plus:"M12 5v14M5 12h14",file:"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h6",users:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",ticket:"M15 5v2M15 11v2M15 17v2M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7a2 2 0 0 1 2-2z",up:"M12 19V5M5 12l7-7 7 7",down:"M12 5v14M19 12l-7 7-7-7",check:"M20 6L9 17l-5-5",out:"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",trash:"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6",dl:"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",search:"M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35",sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",chev:"M6 9l6 6 6-6",clock:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2",alert:"M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",info:"M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 16v-4M12 8h.01",menu:"M4 6h16M4 12h16M4 18h16",refresh:"M20 11a8 8 0 1 0 2 5M20 5v6h-6",filter:"M4 6h16M7 12h10M10 18h4",copy:"M9 9h11v11H9zM4 4h11v3",bolt:"M13 2L4 14h7l-1 8 9-12h-7z",grid:"M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const $=i=>document.getElementById(i);
$("lg").innerHTML=$("bl").innerHTML=ic("shield");$("tb").innerHTML=ic("sun");$("lo").innerHTML=ic("out");$("sw").innerHTML=ic("grid");$("gen").innerHTML=ic("plus")+"<span>Generează Docs</span>";$("sb").innerHTML=ic("menu");$("cmdIcon").innerHTML=ic("search");
const OPTS=[{v:"Up",i:"up",c:"#12a05c",d:"Primește gradul următor"},{v:"Down",i:"down",c:"#d98a0b",d:"Primește gradul anterior"},{v:"Rămâne",i:"check",c:"#3b82f6",d:"Fără schimbări pe Discord"},{v:"Out",i:"out",c:"#dc3f4d",d:"Pierde gradul și rolul de membru"}];
const ACTS=[{v:"Inactiv",c:"#dc3f4d"},{v:"Slabă",c:"#d98a0b"},{v:"Acceptabilă",c:"#3b82f6"},{v:"Bună",c:"#12a05c"},{v:"Excelentă",c:"#8b5cf6"}],ACT=ACTS.map(a=>a.v),AC=Object.fromEntries(ACTS.map(a=>[a.v,a.c]));
const DC=Object.fromEntries(OPTS.map(o=>[o.v,o]));
let FAC="",FACS=[],N={},ORDER=[],D=null,L=[],sort={k:"rank",d:-1},q="",rf="",menu=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/864e5));
const fmt=d=>d.split("-").reverse().join(".");
const ago=n=>n===0?"azi":n===1?"acum o zi":`acum ${n} zile`;
function toast(m,t){const e=document.createElement("div");e.className="toast "+(t||"");e.innerHTML=ic(t==="err"?"alert":t==="ok"?"check":"info")+"<span></span>";e.lastChild.textContent=m;$("toasts").append(e);setTimeout(()=>e.remove(),4200)}
function ask(t,m,o){return new Promise(r=>{$("cT").textContent=t;$("cM").textContent=m;const c=o.c||"var(--ac)";$("cI").style.setProperty("--c",c);$("cI").innerHTML=ic(o.i);$("cOk").className="btn "+(o.danger?"danger":"p");const d=$("dlg");d.returnValue="";d.showModal();d.onclose=()=>r(d.returnValue==="ok")})}
function theme(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("th",r.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}
const COL=["#b91c1c","#12a05c","#d98a0b","#dc3f4d","#8b5cf6","#0ea5b7"];
const av=(n,u,id)=>u?`<img class="av" src="${esc(u)}" alt="" loading="lazy">`:`<div class="av" style="background:${COL[(+String(id).slice(-3)||0)%6]}">${esc((n||"?")[0].toUpperCase())}</div>`;
async function api(u,m,b){const r=await fetch(u,{method:m||"GET",headers:{"Content-Type":"application/json"},body:b&&JSON.stringify(b)});
if(r.status===401){$("login").hidden=false;$("app").hidden=true;$("pick").hidden=true;throw 0}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Eroare "+r.status);return j}
function toggleSidebar(){document.body.classList.toggle("compact");try{localStorage.setItem("sb",document.body.classList.contains("compact")?"1":"0")}catch(e){}}
try{if(localStorage.getItem("sb")==="1")document.body.classList.add("compact");if(localStorage.getItem("density")==="dense")document.body.classList.add("dense")}catch(e){}
function toggleDensity(){document.body.classList.toggle("dense");try{localStorage.setItem("density",document.body.classList.contains("dense")?"dense":"roomy")}catch(e){};toast(document.body.classList.contains("dense")?"Mod compact activat":"Mod confortabil activat","ok")}
function refreshDocs(){if(D)load(D.id);else docs();toast("Datele au fost reîmprospătate","ok")}
function focusSearch(){const x=$("qs");if(x){x.focus();x.select()}}
function pendingOnly(){const b=$("pendingBtn");if(!b)return;const on=b.classList.toggle("active");b.innerHTML=ic("filter")+(on?" Toate rândurile":" Doar nefinalizate");b.dataset.pending=on?"1":"0";rows()}
function copyId(id){navigator.clipboard?.writeText(id).then(()=>toast("ID copiat","ok"))}
const commands=[{t:"Caută membru",d:"Du-te direct în căutarea din tabel",i:"search",k:"/",a:focusSearch},{t:"Arată doar nefinalizate",d:"Ascunde deciziile deja aplicate",i:"filter",a:pendingOnly},{t:"Comută densitatea",d:"Mai multe sau mai puține rânduri pe ecran",i:"grid",a:toggleDensity},{t:"Reîmprospătează Docs",d:"Încarcă din nou datele de pe server",i:"refresh",a:refreshDocs},{t:"Temă",d:"Comută între aspect luminos și întunecat",i:"sun",a:theme}];
function openCmd(){const c=$("cmd");c.hidden=false;renderCmd("");setTimeout(()=>$("cmdInput").focus(),0)}
function closeCmd(){$("cmd").hidden=true}
function renderCmd(term){const x=term.trim().toLowerCase();const list=commands.filter(c=>(c.t+c.d).toLowerCase().includes(x));$("cmdList").innerHTML=list.map((c,i)=>`<div class="cmditem ${i===0?"on":""}" data-i="${commands.indexOf(c)}"><span class="mi" style="--c:var(--ac)">${ic(c.i)}</span><span><b>${c.t}</b><small>${c.d}</small></span>${c.k?`<span class="cmdkey">${c.k}</span>`:""}</div>`).join("")||'<div class="empty" style="padding:28px">Nicio acțiune găsită.</div>'}
$("cmdInput").addEventListener("input",e=>renderCmd(e.target.value));$("cmdList").addEventListener("click",e=>{const x=e.target.closest(".cmditem");if(!x)return;commands[+x.dataset.i].a();closeCmd()});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openCmd()}else if(e.key==="Escape"&&!$("cmd").hidden)closeCmd()});
const U=p=>`/api/${FAC}${p}`;
async function init(){try{const m=await api("/api/me");FACS=m.factions;ME=m.user;$("login").hidden=true;
let f="";try{f=sessionStorage.getItem("fac")||""}catch(e){}
if(FACS.length===1)f=FACS[0].id;
if(FACS.some(x=>x.id===f))await enter(f);else pickScreen()}catch(e){if(e)toast(e.message,"err")}}
let ME=null,FN="";
function swRender(){const w=$("fsw");w.hidden=FACS.length<2;w.innerHTML=FACS.map(f=>`<button style="--c:${f.color}" class="${f.id===FAC?"on":""}" title="${esc(f.name)}" onclick="${f.id===FAC?"":`enter('${f.id}')`}"><i></i><span>${esc(f.name)}</span></button>`).join("")}
function pickScreen(){$("app").hidden=true;$("pick").hidden=false;document.documentElement.dataset.faction="";
$("pkg").innerHTML=FACS.map(f=>`<button class="pkc" style="--c:${f.color}" onclick="enter('${f.id}')"><div class="pl">${ic("shield")}</div><b>${esc(f.name)}</b><small>Deschide panoul ${esc(f.name)}</small></button>`).join("")}
async function enter(id){try{FAC=id;D=null;q="";rf="";const m=await api(U("/meta"));N=m.roles;ORDER=m.order;
try{sessionStorage.setItem("fac",id)}catch(e){}
document.documentElement.dataset.faction=id;$("bn").textContent="Panou "+m.name;document.title="Panou "+m.name;
$("who").textContent=m.user;$("mav").innerHTML=av(m.user,ME.avatar,ME.id);$("sw").hidden=true;FN=m.name;swRender();$("gen").innerHTML=ic("plus")+"<span>Generează Docs "+esc(FN)+"</span>";
$("pick").hidden=true;$("app").hidden=false;await docs()}catch(e){if(e)toast(e.message,"err")}}
async function docs(sel){$("content").innerHTML='<div class="card"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
L=await api(U("/docs"));renderList();
if(L.length)await load(sel||L[0].id);else{D=null;$("content").innerHTML=`<div class="card empty"><div class="logo">${ic("file")}</div><h2>Niciun Docs generat</h2><p>Apasă „Generează Docs" pentru a crea Docs-ul perioadei curente, cu toți membrii facțiunii de pe Discord.</p></div>`}}
function renderList(){$("dl").innerHTML=L.map(d=>`<div class="di ${D&&D.id===d.id?"on":""}" onclick="load('${d.id}')">${ic("file")}<b>${esc(d.name)}</b><span class="cnt">${d.count}</span></div>`).join("")||'<small style="padding:6px 8px">Nimic generat încă.</small>'}
async function load(id){try{D=await api(U("/docs/"+id));renderList();draw()}catch(e){if(e)toast(e.message,"err")}}
function draw(){const R=D.rows,c=k=>R.filter(r=>r.decision===k).length;
const S=(t,l,v,col)=>`<div class="st" style="--c:${col}"><div class="t">${ic(t)}</div><div><span>${l}</span><b>${v}</b></div></div>`;
const cnt={};R.forEach(r=>{if(!r.out&&r.rank)cnt[r.rank]=(cnt[r.rank]||0)+1});const act=Object.values(cnt).reduce((a,b)=>a+b,0)||1;
const rk=ORDER.slice().reverse().filter(o=>cnt[o]);
$("content").innerHTML=`<div class="hd"><div><div class="crumb">Docs</div><h1>${esc(D.name)}</h1><small>Generat${D.createdBy?" de "+esc(D.createdBy):""}${D.createdAt?" &middot; "+new Date(D.createdAt).toLocaleString("ro-RO"):""}</small></div>
<div class="act"><button class="btn" onclick="csv()">${ic("dl")}Export CSV</button><button class="btn ghost d" onclick="delDoc()">${ic("trash")}Șterge Docs</button></div></div>
<div class="stats">${S("users","Membri",R.length,"#b91c1c")}${S("bolt","Activitate bună+",R.filter(r=>r.activity==="Bună"||r.activity==="Excelentă").length,"#8b5cf6")}${S("up","Promovați",c("Up"),"#12a05c")}${S("down","Retrogradați",c("Down"),"#d98a0b")}${S("out","Out",c("Out"),"#dc3f4d")}${S("clock","Fără decizie",R.filter(r=>!r.locked).length,"#7f869b")}</div><div class="quick"><div class="qcard"><div><h3>Flux de lucru</h3><p>Ai ${R.filter(r=>!r.locked).length} membri care așteaptă o decizie.</p></div><button class="btn p" onclick="pendingOnly()">${ic("bolt")} Vezi ce mai e de făcut</button></div><div class="qcard"><div><h3>Activitate</h3><p>Decizii aplicate în acest Docs</p></div><div class="qnum">${R.filter(r=>r.locked).length}</div></div><div class="qcard"><div><h3>Inactivi</h3><p>Membri marcați Inactiv</p></div><div class="qnum">${R.filter(r=>r.activity==="Inactiv").length}</div></div></div>
${rk.length?`<div class="card dist"><h3>Distribuția pe grade</h3><div class="bar">${rk.map(o=>`<i style="--c:${N[o]?.color||"#7f869b"};width:${cnt[o]/act*100}%"></i>`).join("")}</div><div class="lg">${rk.map(o=>`<span style="--c:${N[o]?.color||"#7f869b"}"><u></u>${esc(N[o]?.name||"?")} <b>${cnt[o]}</b></span>`).join("")}</div></div>`:""}
<div class="card"><div class="tb"><div class="sr">${ic("search")}<input id="qs" placeholder="Caută după nume sau ID" value="${esc(q)}" oninput="q=this.value;rows()"><kbd>/</kbd></div>
<select class="fs" onchange="rf=this.value;rows()"><option value="">Toate gradele</option>${ORDER.slice().reverse().map(o=>`<option value="${o}"${rf===o?" selected":""}>${esc(N[o]?.name||o)}</option>`).join("")}</select><div class="toolbar"><button class="btn" onclick="refreshDocs()" title="Reîmprospătează">${ic("refresh")}</button><button class="btn" onclick="toggleDensity()" title="Densitate">${ic("grid")}</button><button class="btn" id="pendingBtn" onclick="pendingOnly()" title="Filtru decizii">${ic("filter")} Doar nefinalizate</button></div><span class="res" id="res"></span></div>
<div class="ov"><table><thead><tr>${[["name","Membru"],["activity","Activitate"],["rank","Grad"],["since","În grad de la"],["decision","Decizie"]].map(([k,l])=>`<th onclick="srt('${k}')">${l}${sort.k===k?`<svg class="i" viewBox="0 0 24 24" style="${sort.d>0?"":"transform:rotate(180deg)"}"><path d="${P.chev}" transform="rotate(180 12 12)"/></svg>`:""}</th>`).join("")}</tr></thead><tbody id="tbody"></tbody></table></div></div>`;rows()}
function srt(k){sort=sort.k===k?{k,d:-sort.d}:{k,d:k==="name"?1:-1};draw()}
function rows(){const pending=$("pendingBtn")?.dataset.pending==="1";let R=D.rows.filter(r=>(!rf||r.rank===rf)&&(!q||(r.name+r.uid).toLowerCase().includes(q.toLowerCase()))&&(!pending||!r.locked));
const v=r=>sort.k==="rank"?(r.out?-2:ORDER.indexOf(r.rank)):sort.k==="since"?(r.since?new Date(r.since).getTime():Infinity):sort.k==="name"?r.name.toLowerCase():sort.k==="activity"?ACT.indexOf(r.activity):r.decision;
R=R.slice().sort((a,b)=>(v(a)>v(b)?1:v(a)<v(b)?-1:0)*sort.d);const mx=1;
$("tbody").innerHTML=R.map(r=>row(r,mx)).join("")||`<tr><td colspan="5" class="empty">Niciun rezultat pentru filtrele curente.</td></tr>`;
$("res").textContent=`${R.length} din ${D.rows.length} membri`}
const SRC={audit:"Data din Audit Log Discord",panel:"Setat din panou la ultima schimbare",seen:"Prima detectare în panou (Audit Log expirat sau indisponibil)"};
function row(r,mx){const rc=N[r.rank]||{},d0=r.since?days(r.since):0;
const chip=r.out?'<span class="chip" style="--c:#dc3f4d">OUT</span>':r.rank?`<span class="chip" style="--c:${rc.color||"#7f869b"}">${esc(rc.name||"?")}</span>`:`<span class="mu">Fără grad</span>${(r.extra||[]).length?`<small title="Roluri găsite pe Discord, dar care nu sunt în RANK_ROLE_IDS">${esc(r.extra.slice(0,3).map(x=>N[x]?.name||x).join(", "))}</small>`:""}`;
const since=r.since?`<div style="font-weight:600">${fmt(r.since)}</div><span class="pill" title="${SRC[r.sinceSrc]||""}">${ago(d0)}${r.sinceSrc==="seen"?" &middot; aprox.":""}</span>`:'<span class="mu">Necunoscut</span>';
const o=DC[r.decision];
const dcell=r.locked?`<span class="dec" style="--c:${o?o.c:"#7f869b"}">${o?ic(o.i):""}${esc(r.decision)}</span><small style="margin-top:3px">de ${esc(r.by||"-")}</small>`
:`<button class="dbtn" onclick="openMenu(this,'${r.uid}')"><span>Alege decizia</span>${ic("chev")}</button>`;
return `<tr class="${r.out?"out":""}"><td><div class="who"><div class="avw" style="--r:${r.locked&&o?o.c:"transparent"}">${av(r.name,r.avatar,r.uid)}</div><div><b>${esc(r.name)}</b><small>${r.uid} <button class="btn ic" style="width:22px;height:22px;display:inline-grid;vertical-align:-7px" title="Copiază ID" onclick="event.stopPropagation();copyId('${r.uid}')">${ic("copy")}</button></small></div></div></td>
<td><select class="asel" style="--c:${r.activity?AC[r.activity]:'#7f869b'}" onchange="act('${r.uid}',this.value)"><option value="">Alege…</option>${ACTS.map(a=>`<option value="${a.v}"${r.activity===a.v?" selected":""}>${a.v}</option>`).join("")}</select></td><td>${chip}</td><td>${since}</td><td>${dcell}</td></tr>`}
function openMenu(btn,uid){closeMenu();const b=btn.getBoundingClientRect(),m=document.createElement("div");m.className="menu";
m.innerHTML=OPTS.map(o=>`<button data-v="${o.v}" style="--c:${o.c}"><span class="mi">${ic(o.i)}</span><span><b>${o.v}</b><small>${o.d}</small></span></button>`).join("");
document.body.append(m);const h=m.offsetHeight;let t=b.bottom+6;if(t+h>innerHeight-8)t=b.top-h-6;
m.style.top=t+"px";m.style.left=Math.max(8,Math.min(b.left,innerWidth-m.offsetWidth-8))+"px";
m.onclick=e=>{const x=e.target.closest("button");if(x){closeMenu();dec(uid,x.dataset.v)}};menu=m}
function closeMenu(){if(menu){menu.remove();menu=null}}
document.addEventListener("click",e=>{if(!e.target.closest(".menu,.dbtn"))closeMenu()});addEventListener("scroll",closeMenu,true);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&$("qs")){e.preventDefault();$("qs").focus()}});
async function act(u,v){try{await api(U(`/docs/${D.id}/rows/${u}`),"PATCH",{activity:v});D.rows.find(r=>r.uid===u).activity=v||null;draw()}catch(e){if(e)toast(e.message,"err")}}
async function dec(u,v){const r=D.rows.find(x=>x.uid===u),o=DC[v];
const msg={Up:"va primi gradul următor",Down:"va primi gradul anterior",Out:"va pierde gradul și rolul de membru","Rămâne":"rămâne neschimbat"}[v];
if(!await ask(`Aplici „${v}"?`,`${r.name} ${msg} pe Discord. Decizia nu mai poate fi schimbată în acest Docs.`,{i:o.i,c:o.c,danger:v==="Out"}))return;
try{await api(U(`/docs/${D.id}/rows/${u}`),"PATCH",{decision:v});toast(`${r.name}: ${v} aplicat pe Discord`,"ok")}catch(e){if(e)toast(e.message,"err")}load(D.id)}
async function gen(){const b=$("gen");b.disabled=true;b.innerHTML=ic("clock")+"Se generează";
try{const d=await api(U("/docs"),"POST");toast("Docs generat","ok");await docs(d.id)}catch(e){if(e)toast(e.message,"err")}b.disabled=false;b.innerHTML=ic("plus")+"<span>Generează Docs "+esc(FN)+"</span>"}
async function delDoc(){if(!await ask("Ștergi acest Docs?",`„${D.name}" va fi șters definitiv. Rolurile de pe Discord nu se schimbă.`,{i:"trash",c:"#dc3f4d",danger:true}))return;
try{await api(U("/docs/"+D.id),"DELETE");toast("Docs șters","ok");D=null;await docs()}catch(e){if(e)toast(e.message,"err")}}
function csv(){const h="ID Discord,Nume,Activitate,Grad,În grad de la,Decizie\n",b=D.rows.map(r=>[r.uid,r.name,r.activity||"",r.out?"OUT":N[r.rank]?.name||"",r.since||"",r.decision].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+h+b],{type:"text/csv"}));a.download=D.name.replace(/[ /]/g,"")+".csv";a.click()}
async function out(){try{sessionStorage.removeItem("fac")}catch(e){}await fetch("/auth/logout",{method:"POST"});location.reload()}
init();
</script></body></html>
